<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ka-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e29" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#ka-grad)" stroke-width="8" opacity="0.3" />

  <!-- Headphone Arc -->
  <path d="M140 260 C140 150, 372 150, 372 260" fill="none" stroke="url(#ka-grad)" stroke-width="36" stroke-linecap="round" />

  <!-- Left Ear Cup -->
  <rect x="110" y="240" width="56" height="100" rx="28" fill="url(#ka-grad)" />
  <rect x="126" y="256" width="24" height="68" rx="12" fill="#0b0e14" />

  <!-- Right Ear Cup -->
  <rect x="346" y="240" width="56" height="100" rx="28" fill="url(#ka-grad)" />
  <rect x="362" y="256" width="24" height="68" rx="12" fill="#0b0e14" />

  <!-- Sound Waves (Center) -->
  <line x1="216" y1="260" x2="216" y2="320" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />
  <line x1="240" y1="230" x2="240" y2="350" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />
  <line x1="264" y1="210" x2="264" y2="370" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" />
  <line x1="288" y1="230" x2="288" y2="350" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />
  <line x1="312" y1="260" x2="312" y2="320" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />
</svg>
