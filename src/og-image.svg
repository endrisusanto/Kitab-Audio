<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="50%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#181e2b" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2533" />
      <stop offset="100%" stop-color="#131822" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Subtle Glow Grids / Ambient Circles -->
  <circle cx="200" cy="180" r="280" fill="#f59e0b" opacity="0.06" filter="blur(60px)" />
  <circle cx="1020" cy="450" r="240" fill="#38bdf8" opacity="0.04" filter="blur(50px)" />

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#252e3e" stroke-width="2" />

  <!-- Left: Brand Logo Box -->
  <g transform="translate(100, 165)">
    <!-- Logo Rounded Square -->
    <rect width="160" height="160" rx="36" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.4" />
    
    <!-- Headphone Arc -->
    <path d="M44 86 C44 48, 116 48, 116 86" fill="none" stroke="url(#gold-grad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Left Cup -->
    <rect x="34" y="78" width="20" height="34" rx="10" fill="url(#gold-grad)" />
    <!-- Right Cup -->
    <rect x="106" y="78" width="20" height="34" rx="10" fill="url(#gold-grad)" />
    
    <!-- Sound Waves Inside Logo -->
    <line x1="68" y1="84" x2="68" y2="104" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
    <line x1="80" y1="74" x2="80" y2="114" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
    <line x1="92" y1="84" x2="92" y2="104" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Middle: Typography & Content -->
  <!-- Badge -->
  <rect x="290" y="165" width="230" height="36" rx="18" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" />
  <text x="305" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" letter-spacing="1.5">DATABASE AUDIO GEAR</text>

  <!-- Title -->
  <text x="290" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">Kitab Audio</text>

  <!-- Subtitle -->
  <text x="290" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Panduan &amp; Tier List Audio Gear Fernanda Gunsan
  </text>

  <!-- Description -->
  <text x="290" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748b">
    Katalog 812+ Gear • 21 Kategori • Skor Frekuensi Suara • AI Audio Concierge
  </text>

  <!-- Feature Pills Row -->
  <g transform="translate(100, 420)">
    <!-- Pill 1: TWS & IEM -->
    <rect x="0" y="0" width="180" height="52" rx="12" fill="#18202c" stroke="#2a3649" stroke-width="1.5" />
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">🎧 TWS &amp; IEM</text>

    <!-- Pill 2: DAC & Amp -->
    <rect x="200" y="0" width="200" height="52" rx="12" fill="#18202c" stroke="#2a3649" stroke-width="1.5" />
    <text x="224" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">🎛️ DAC &amp; Headphone</text>

    <!-- Pill 3: Tier List -->
    <rect x="420" y="0" width="190" height="52" rx="12" fill="#18202c" stroke="#2a3649" stroke-width="1.5" />
    <text x="444" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">🏆 Tier SS s.d. E</text>

    <!-- Pill 4: AI Chat -->
    <rect x="630" y="0" width="190" height="52" rx="12" fill="#18202c" stroke="#2a3649" stroke-width="1.5" />
    <text x="654" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">🤖 Asisten AI RAG</text>

    <!-- Pill 5: Live Excel Update -->
    <rect x="840" y="0" width="160" height="52" rx="12" fill="#18202c" stroke="#2a3649" stroke-width="1.5" />
    <text x="864" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">📤 Auto Update</text>
  </g>

  <!-- Footer Link -->
  <text x="100" y="545" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#f59e0b" font-weight="600">
    audio.endrisusanto.my.id
  </text>
</svg>
